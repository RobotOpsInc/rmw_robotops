name: CI

on:
  push:
    branches: ['feature/**', '[0-9]*']

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Cloudsmith credentials
        run: |
          # Service account format: service_account_username:api_key
          mkdir -p ~/.cloudsmith
          echo "github-actions-bk1d:${{ secrets.CLOUDSMITH_API_KEY }}" > ~/.cloudsmith/key

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: test
          push: false
          load: true
          tags: rmw_robotops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            cloudsmith_key=/home/runner/.cloudsmith/key

      - name: Run CI suite (lint, build, test)
        run: |
          docker run --rm \
            -v $PWD:/workspace/src/rmw_robotops \
            -v ci-build:/workspace/build \
            -v ci-install:/workspace/install \
            -e ASAN_OPTIONS=detect_leaks=1:check_initialization_order=1 \
            -e UBSAN_OPTIONS=print_stacktrace=1 \
            -w /workspace/src/rmw_robotops \
            --entrypoint "" \
            rmw_robotops:ci \
            just ci-inner

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark_results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/rmw_robotops/test_results/**/*.xml
            build/rmw_robotops/Testing/**/*
