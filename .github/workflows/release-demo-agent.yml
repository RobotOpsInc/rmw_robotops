name: Release demo-agent binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v0.9.0)'
        required: true
        type: string

jobs:
  build-demo-agent:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write  # Needed to upload release assets
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: demo-agent
          file: demo-agent/Dockerfile
          push: false
          load: true
          tags: robotops-demo-agent:release-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release binary
        run: |
          docker run --rm \
            -v "$PWD/demo-agent:/workspace" \
            -w /workspace \
            --entrypoint "" \
            robotops-demo-agent:release-${{ matrix.arch }} \
            bash -c "source /opt/ros/jazzy/setup.bash && cargo build --release"

      - name: Prepare asset
        run: |
          cp demo-agent/target/release/robotops-demo-agent \
             robotops-demo-agent-linux-${{ matrix.arch }}

      - name: Upload binary to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "robotops-demo-agent-linux-${{ matrix.arch }}" \
            --clobber
