name: Release

on:
  workflow_dispatch:
    # Manual trigger only - production releases from main branch only
    inputs:
      dry_run:
        description: 'Dry run (validate without creating release)'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '189676910689'
  DEPLOY_ROLE: arn:aws:iam::189676910689:role/github-actions-deploy-production
  CLOUDFRONT_DISTRIBUTION_ID: E3QAA3BBMD2WVG
  APT_BUCKET: robotops-apt-pub-production
  APT_REPO_URL: https://apt.robotops.com

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create releases and tags
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release is from main branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Production releases can only be created from main branch"
            echo "Current branch: ${{ github.ref }}"
            echo "For development releases, use the Release Development workflow"
            exit 1
          fi
          echo "📦 Production release from main branch"

      - name: Get version from package.xml
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' package.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Check tag doesn't already exist
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract section from CHANGELOG.rst
          # Format: version (date) followed by --- separator
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^[0-9]+\.[0-9]+\.[0-9]+ \(/ {
              if (found) exit
              if ($0 ~ ver) {
                found=1
                next  # Skip the version line
              }
            }
            /^---/ {
              if (found) {
                next  # Skip the separator line
              }
            }
            /^[0-9]+\.[0-9]+\.[0-9]+ \(/ {
              if (found) exit  # Stop at next version
            }
            found { print }
          ' CHANGELOG.rst)

          # Write to file for gh release
          echo "$CHANGELOG" > release_notes.md

          # Add package repository link
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "**📦 Debian Packages:** https://apt.robotops.com" >> release_notes.md

          echo "Extracted changelog:"
          cat release_notes.md

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Would create release:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** Release ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Notes" >> $GITHUB_STEP_SUMMARY
          cat release_notes.md >> $GITHUB_STEP_SUMMARY

  build-packages:
    runs-on: ${{ matrix.runner }}
    needs: release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write  # Needed to upload release assets
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' package.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: base
          push: false
          load: true
          tags: rmw-robotops:build-${{ matrix.arch }}
          build-args: |
            APT_REPO_URL=${{ env.APT_REPO_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Debian package
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/ws/src/rmw_robotops \
            -v ${{ github.workspace }}:/output \
            rmw-robotops:build-${{ matrix.arch }} bash -c "
              cd /ws && \
              apt-get update && \
              apt-get install --only-upgrade -y ros-jazzy-robotops-msgs ros-jazzy-robotops-config || true && \
              rosdep update && \
              rosdep install --from-paths src --ignore-src -r -y && \
              cd /ws/src/rmw_robotops && \
              bloom-generate rosdebian --os-name ubuntu --os-version noble --ros-distro jazzy && \
              dpkg-buildpackage -us -uc -b && \
              cp /ws/src/*.deb /output/
            "

      - name: Find built package
        id: deb
        run: |
          DEB_FILE=$(ls *.deb | head -n1)
          echo "file=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "Built package: $DEB_FILE"

      - name: Upload Debian package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-${{ matrix.arch }}
          path: ${{ steps.deb.outputs.file }}
          retention-days: 1

  publish-debian:
    runs-on: ubuntu-latest
    needs: build-packages
    if: ${{ !inputs.dry_run }}
    permissions:
      id-token: write  # Needed for AWS OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' package.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download all Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: debian-package-*
          path: ./packages
          merge-multiple: true

      - name: List downloaded packages
        run: |
          echo "Downloaded packages:"
          ls -lh ./packages/

      - name: Publish Debian packages to S3
        uses: ./.github/actions/publish-debian-s3
        with:
          deb-files: './packages/*.deb'
          apt-bucket: ${{ env.APT_BUCKET }}
          cloudfront-distribution-id: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Summary
        run: |
          echo "## Debian Package Publishing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          for deb in ./packages/*.deb; do
            echo "- $(basename $deb)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ APT Repository: https://apt.robotops.com" >> $GITHUB_STEP_SUMMARY
