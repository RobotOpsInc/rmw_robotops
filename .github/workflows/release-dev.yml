name: Release Development

on:
  workflow_dispatch:
    # Manual trigger only - development releases from development branch only
    inputs:
      dry_run:
        description: 'Dry run (validate without creating release)'
        type: boolean
        default: false

jobs:
  release-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create releases and tags
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release is from development branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/development" ]]; then
            echo "::error::Development releases can only be created from development branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "🧪 Development pre-release from development branch"

      - name: Get version from package.xml
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' package.xml)
          DEV_TAG="v${VERSION}-development-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$DEV_TAG" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION (development)"

      - name: Check tag doesn't already exist
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract section from CHANGELOG.rst
          # Format: version (date) followed by --- separator
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^[0-9]+\.[0-9]+\.[0-9]+ \(/ {
              if (found) exit
              if ($0 ~ ver) {
                found=1
                next  # Skip the version line
              }
            }
            /^---/ {
              if (found) {
                next  # Skip the separator line
              }
            }
            /^[0-9]+\.[0-9]+\.[0-9]+ \(/ {
              if (found) exit  # Stop at next version
            }
            found { print }
          ' CHANGELOG.rst)

          # Write to file for gh release
          echo "$CHANGELOG" > release_notes.md

          # Add package repository link
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "**📦 Debian Packages:** https://cloudsmith.io/~robotops/repos/robotops-development/packages/" >> release_notes.md

          echo "Extracted changelog:"
          cat release_notes.md

      - name: Create GitHub Pre-Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Pre-Release ${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md \
            --prerelease

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Would create pre-release:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** Pre-Release ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Notes" >> $GITHUB_STEP_SUMMARY
          cat release_notes.md >> $GITHUB_STEP_SUMMARY

  publish-dev-packages:
    runs-on: ${{ matrix.runner }}
    needs: release-dev
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write  # Needed to upload release assets
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' package.xml)
          DEV_TAG="v${VERSION}-development-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$DEV_TAG" >> $GITHUB_OUTPUT

      - name: Determine Cloudsmith repository
        id: repo
        run: |
          echo "repo=robotops-development" >> $GITHUB_OUTPUT
          echo "Deploying to: development (robotops-development)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: base
          push: false
          load: true
          tags: rmw-robotops:build-${{ matrix.arch }}
          build-args: |
            CLOUDSMITH_REPO=${{ steps.repo.outputs.repo }}
            CLOUDSMITH_USERNAME=${{ secrets.CLOUDSMITH_USERNAME }}
            CLOUDSMITH_API_KEY=${{ secrets.CLOUDSMITH_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Debian package
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/ws/src/rmw_robotops \
            -v ${{ github.workspace }}:/output \
            rmw-robotops:build-${{ matrix.arch }} bash -c "
              cd /ws/src/rmw_robotops && \
              apt-get update && \
              bloom-generate rosdebian --os-name ubuntu --os-version noble --ros-distro jazzy && \
              dpkg-buildpackage -us -uc -b && \
              cp /ws/src/*.deb /output/
            "

      - name: Find built package
        id: deb
        run: |
          DEB_FILE=$(ls *.deb | head -n1)
          echo "file=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "Built package: $DEB_FILE"

      - name: Upload to Cloudsmith
        uses: cloudsmith-io/action@v0.6.10
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: "push"
          format: "deb"
          owner: "robotops"
          repo: ${{ steps.repo.outputs.repo }}
          distro: "ubuntu"
          release: "noble"
          republish: "true"
          file: ${{ steps.deb.outputs.file }}

      - name: Summary
        run: |
          echo "## Package Publishing (Development - ${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Package: ${{ steps.deb.outputs.file }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "✅ Debian package: https://cloudsmith.io/~robotops/repos/${{ steps.repo.outputs.repo }}/packages/" >> $GITHUB_STEP_SUMMARY
