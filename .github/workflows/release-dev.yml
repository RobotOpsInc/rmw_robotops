name: Release Development

on:
  workflow_dispatch:
    # Manual trigger only - development releases from development branch only
    inputs:
      dry_run:
        description: 'Dry run (validate without creating release)'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '717949299175'
  DEPLOY_ROLE: arn:aws:iam::717949299175:role/github-actions-deploy-development
  CLOUDFRONT_DISTRIBUTION_ID: EE9YB1UW7HRUQ
  APT_BUCKET: robotops-apt-pub-development
  APT_REPO_URL: https://apt.development.robotops.com

jobs:
  release-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create releases and tags
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release is from development branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/development" ]]; then
            echo "::error::Development releases can only be created from development branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "🧪 Development pre-release from development branch"

      - name: Get version from package.xml
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' package.xml)
          DEV_TAG="v${VERSION}-development-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$DEV_TAG" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION (development)"

      - name: Check tag doesn't already exist
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract section from CHANGELOG.rst
          # Format: version (date) followed by --- separator
          CHANGELOG=$(awk -v ver="$VERSION" '
            /^[0-9]+\.[0-9]+\.[0-9]+ \(/ {
              if (found) exit
              if ($0 ~ ver) {
                found=1
                next  # Skip the version line
              }
            }
            /^---/ {
              if (found) {
                next  # Skip the separator line
              }
            }
            /^[0-9]+\.[0-9]+\.[0-9]+ \(/ {
              if (found) exit  # Stop at next version
            }
            found { print }
          ' CHANGELOG.rst)

          # Write to file for gh release
          echo "$CHANGELOG" > release_notes.md

          # Add package repository link
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "**📦 Debian Packages:** https://apt.development.robotops.com" >> release_notes.md

          echo "Extracted changelog:"
          cat release_notes.md

      - name: Create GitHub Pre-Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Pre-Release ${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md \
            --prerelease

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Would create pre-release:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** Pre-Release ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Notes" >> $GITHUB_STEP_SUMMARY
          cat release_notes.md >> $GITHUB_STEP_SUMMARY

  build-dev-packages:
    runs-on: ${{ matrix.runner }}
    needs: release-dev
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write  # Needed to upload release assets
    strategy:
      fail-fast: false
      matrix:
        # See release.yml for the rationale. jazzy → Noble (amd64 + arm64);
        # humble → Jammy, arm64 only (robot_agent's Jetson Humble build depends
        # on ros-humble-rmw-robotops — ROB-325). bloom encodes the distro in the
        # .deb name (ros-<distro>-rmw-robotops_*) so the two arm64 builds never
        # collide.
        include:
          - arch: amd64
            runner: ubuntu-24.04
            ros_distro: jazzy
            os_version: noble
          - arch: arm64
            runner: ubuntu-24.04-arm
            ros_distro: jazzy
            os_version: noble
          - arch: arm64
            runner: ubuntu-24.04-arm
            ros_distro: humble
            os_version: jammy
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' package.xml)
          DEV_TAG="v${VERSION}-development-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$DEV_TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: base
          push: false
          load: true
          tags: rmw-robotops:build-${{ matrix.ros_distro }}-${{ matrix.arch }}
          build-args: |
            APT_REPO_URL=${{ env.APT_REPO_URL }}
            ROS_DISTRO=${{ matrix.ros_distro }}
          cache-from: type=gha,scope=${{ matrix.ros_distro }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ros_distro }}-${{ matrix.arch }}

      - name: Build Debian package
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/ws/src/rmw_robotops \
            -v ${{ github.workspace }}:/output \
            rmw-robotops:build-${{ matrix.ros_distro }}-${{ matrix.arch }} bash -c "
              cd /ws && \
              apt-get update && \
              apt-get install --only-upgrade -y ros-${{ matrix.ros_distro }}-robotops-msgs ros-${{ matrix.ros_distro }}-robotops-config || true && \
              rosdep update && \
              rosdep install --from-paths src --ignore-src -r -y --rosdistro ${{ matrix.ros_distro }} && \
              cd /ws/src/rmw_robotops && \
              bloom-generate rosdebian --os-name ubuntu --os-version ${{ matrix.os_version }} --ros-distro ${{ matrix.ros_distro }} && \
              dpkg-buildpackage -us -uc -b && \
              cp /ws/src/*.deb /output/
            "

      - name: Find built package
        id: deb
        run: |
          # bloom names the deb ros-<distro>-rmw-robotops_<ver>_<arch>.deb, so the
          # distro is already encoded; pick the matching one explicitly so the
          # ros-jazzy-* and ros-humble-* arm64 builds never grab each other's.
          DEB_FILE=$(ls ros-${{ matrix.ros_distro }}-rmw-robotops_*_${{ matrix.arch }}.deb | head -n1)
          echo "file=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "Built package: $DEB_FILE"

      - name: Upload Debian package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-${{ matrix.ros_distro }}-${{ matrix.arch }}
          path: ${{ steps.deb.outputs.file }}
          retention-days: 1

  build-demo-agent:
    runs-on: ${{ matrix.runner }}
    needs: release-dev
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write  # Needed to upload release assets
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' package.xml)
          DEV_TAG="v${VERSION}-development-$(git rev-parse --short HEAD)"
          echo "tag=$DEV_TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: demo-agent
          file: demo-agent/Dockerfile
          push: false
          load: true
          tags: robotops-demo-agent:release-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release binary
        run: |
          docker run --rm \
            -v "$PWD/demo-agent:/workspace" \
            -w /workspace \
            --entrypoint "" \
            robotops-demo-agent:release-${{ matrix.arch }} \
            bash -c "source /opt/ros/jazzy/setup.bash && cargo build --release"

      - name: Upload binary to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp demo-agent/target/release/robotops-demo-agent \
             robotops-demo-agent-linux-${{ matrix.arch }}
          gh release upload "${{ steps.version.outputs.tag }}" \
            "robotops-demo-agent-linux-${{ matrix.arch }}" \
            --clobber

  publish-dev-debian:
    runs-on: ubuntu-latest
    needs: build-dev-packages
    if: ${{ !inputs.dry_run }}
    permissions:
      id-token: write  # Needed for AWS OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' package.xml)
          DEV_TAG="v${VERSION}-development-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$DEV_TAG" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Download every (ros_distro, arch) deb artifact built above, flattened
      # into one directory. The shared publish-debian-s3 action adds them all to
      # the single `robotops` aptly repo, published to every Ubuntu codename
      # (noble/jammy/focal). ros-jazzy-* (Noble) and ros-humble-* (Jammy) are
      # distinct packages, so they coexist without collision — see ROB-325. The
      # publish action is SHARED across all RobotOps repos writing one S3 aptly
      # DB and is intentionally NOT switched to per-channel repos here.
      - name: Download all Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: debian-package-*
          path: ./packages
          merge-multiple: true

      - name: List downloaded packages
        run: |
          echo "Downloaded packages:"
          ls -lh ./packages/

      - name: Publish Debian packages to S3
        uses: ./.github/actions/publish-debian-s3
        with:
          deb-files: './packages/*.deb'
          apt-bucket: ${{ env.APT_BUCKET }}
          cloudfront-distribution-id: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Summary
        run: |
          echo "## Debian Package Publishing (Development)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          for deb in ./packages/*.deb; do
            echo "- $(basename $deb)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ APT Repository: https://apt.development.robotops.com" >> $GITHUB_STEP_SUMMARY
