[package]
name = "robotops-demo-agent"
version = "0.1.0"
edition = "2021"
description = "Lightweight demo agent for evaluating rmw_robotops observability locally. For production use, see https://robotops.com."

[[bin]]
name = "robotops-demo-agent"
path = "src/main.rs"

[dependencies]
# ROS2 integration
r2r = "0.9"

# CDR deserialization for raw r2r subscriptions
cdr = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Concurrency
parking_lot = "0.12"

# Time
chrono = "0.4"

# Pin to Cargo-1.82-compatible release (same reason as robot_agent)
home = "=0.5.11"

# Parquet output (pure Rust, no C++ compilation)
arrow = { version = "58", default-features = false, features = ["ipc"] }
parquet = { version = "58", features = ["arrow", "snap"] }

# Unified object store: local filesystem + S3-compatible storage
object_store = { version = "0.11", features = ["aws"] }

# URL parsing for s3:// URIs
url = "2"

# In-memory byte buffer for Parquet serialisation
bytes = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
