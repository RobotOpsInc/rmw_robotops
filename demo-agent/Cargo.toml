[package]
name = "robotops-demo-agent"
version = "0.1.0"
edition = "2021"
description = "Lightweight demo agent for evaluating rmw_robotops observability locally. For production use, see https://robotops.com."

[[bin]]
name = "robotops-demo-agent"
path = "src/main.rs"

[dependencies]
# ROS2 integration
r2r = "0.9"

# CDR deserialization for raw r2r subscriptions
cdr = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Concurrency
parking_lot = "0.12"

# Time
chrono = "0.4"

# Pin to Cargo-1.82-compatible release (same reason as robot_agent)
home = "=0.5.11"

# DuckDB (default output; links against system libduckdb in CI,
# use --features duckdb-output/bundled for standalone release builds)
[dependencies.duckdb]
version = "1"
optional = true

# PostgreSQL (optional output)
[dependencies.tokio-postgres]
version = "0.7"
optional = true

# OTLP gRPC (optional output)
[dependencies.tonic]
version = "0.14"
optional = true

[dependencies.prost]
version = "0.14"
optional = true

[dependencies.opentelemetry-proto]
version = "0.31"
features = ["gen-tonic", "logs", "trace"]
optional = true

[features]
default = ["duckdb-output"]
duckdb-output = ["dep:duckdb"]
postgres = ["dep:tokio-postgres"]
otlp = ["dep:tonic", "dep:prost", "dep:opentelemetry-proto"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
